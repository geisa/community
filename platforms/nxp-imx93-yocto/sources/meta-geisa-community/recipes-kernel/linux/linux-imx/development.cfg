# Checkpoint/restore and socket diagnostics are inert until a diagnostic tool
# uses them. Keep CRIU itself optional: the development image has the kernel
# baseline without adding a service or a large userspace dependency chain.
CONFIG_CHECKPOINT_RESTORE=y
CONFIG_UNIX_DIAG=m
CONFIG_PACKET_DIAG=m
CONFIG_NETLINK_DIAG=m
CONFIG_INET_UDP_DIAG=m

# Common development adapters and virtual/serial CAN paths. They remain
# loadable modules rather than broad, always-resident protocol support.
CONFIG_USB_SERIAL_CH341=m
CONFIG_CAN_VCAN=m
CONFIG_CAN_SLCAN=m
CONFIG_CAN_GS_USB=m

# Trace facilities and dynamic probes are disabled until explicitly used. They
# support field diagnosis alongside the existing perf and BPF kernel support.
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_DYNAMIC_FTRACE=y

# cfg80211 is built in and requests regulatory.db before the root filesystem
# becomes available. Embed the signed database and detached signature from the
# checksum-verified wireless-regdb recipe in the kernel image.
CONFIG_EXTRA_FIRMWARE="regulatory.db regulatory.db.p7s"
CONFIG_EXTRA_FIRMWARE_DIR="firmware"
