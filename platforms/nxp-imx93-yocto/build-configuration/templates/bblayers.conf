# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  @PLATFORM_ROOT@/sources/poky/meta \
  @PLATFORM_ROOT@/sources/poky/meta-poky \
  @PLATFORM_ROOT@/sources/poky/meta-yocto-bsp \
  @PLATFORM_ROOT@/sources/meta-arm/meta-arm-bsp \
  @PLATFORM_ROOT@/sources/meta-arm/meta-arm \
  @PLATFORM_ROOT@/sources/meta-arm/meta-arm-toolchain \
  @PLATFORM_ROOT@/sources/meta-arm/meta-arm-systemready \
  @PLATFORM_ROOT@/sources/meta-freescale \
  @PLATFORM_ROOT@/sources/meta-geisa-community \
  "
