# Start the mock broker after its LXC bridge is available and use the
# mock-specific broker configuration.
[Unit]
Wants=lxc-net.service
After=lxc-net.service

[Service]
ExecStart=
ExecStart=/usr/sbin/mosquitto -c /etc/mosquitto/geisa-api-mock.conf
